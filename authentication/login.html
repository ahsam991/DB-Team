<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — কাজকর্ম শিখ</title>
<link rel="icon" href="/authentication/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/authentication/styles.css">
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/authentication/logo.png" alt="কাজকর্ম শিখ">
      <div>
        <div class="auth-title">Login</div>
        <div class="auth-sub">কাজকর্ম শিখ — V2 Technologies</div>
      </div>
    </div>
    <form id="login-form" novalidate>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" autofocus>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="submit-btn">Login</button>
    </form>
    <div class="auth-switch">
      Don't have an account? <a href="/authentication/signup.html">Sign up</a>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('submit-btn');

      const params = new URLSearchParams(window.location.search);
      const next = params.get('next') || '/';

      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const errorEl = form.querySelector('.form-error');
        if (errorEl) errorEl.remove();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          showError('Please enter your email and password.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in…';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();

          if (!res.ok) throw new Error(data.error || 'Login failed');

          window.location.href = data.redirect || next;
        } catch (err) {
          showError(err.message || 'Login failed. Please try again.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login';
        }
      });

      function showError(message) {
        let el = form.querySelector('.form-error');
        if (!el) {
          el = document.createElement('div');
          el.className = 'form-error';
          form.prepend(el);
        }
        el.textContent = message;
      }
    })();
  </script>
</body>
</html>
